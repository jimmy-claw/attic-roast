<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Logos Attic Coffee mark">
  <!-- A cup whose steam is a network: three nodes joined by edges. -->
  <g fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- cup body -->
    <path d="M44 112 H156 V160 a16 16 0 0 1 -16 16 H60 a16 16 0 0 1 -16 -16 Z"/>
    <!-- handle -->
    <path d="M156 124 a20 20 0 0 1 0 32"/>
    <!-- steam edges -->
    <path d="M78 112 V74 L100 58 L122 74 V112"/>
  </g>
  <!-- steam nodes -->
  <g fill="currentColor">
    <circle cx="78" cy="74" r="7"/>
    <circle cx="100" cy="58" r="7"/>
    <circle cx="122" cy="74" r="7"/>
  </g>
</svg>
