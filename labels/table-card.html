<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>card</title>
<style>@page{size:148mm 210mm;margin:0}</style>
<link rel="stylesheet" href="label.css"></head><body>
<div class="card">
  <img class="bg" src="../assets/img/hero-plant.jpg" alt="">
  <div class="veil"></div>
  <div class="in">
    <div class="row">
      <span class="tiny tiny--bone">Logos&nbsp;Attic&nbsp;×&nbsp;Dark&nbsp;Prague&nbsp;2026</span>
      <span class="tiny">Old&nbsp;Wastewater&nbsp;Plant&nbsp;·&nbsp;Prague</span>
    </div>
    <div class="spacer" style="flex:1"></div>
    <div style="color:var(--ember);margin-bottom:6mm"><svg class="emblem" viewBox="0 0 200 200" fill="none" aria-hidden="true" style="color:#E2542B">
<g fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
<path d="M44 112 H156 V160 a16 16 0 0 1 -16 16 H60 a16 16 0 0 1 -16 -16 Z"/>
<path d="M156 124 a20 20 0 0 1 0 32"/>
<path d="M78 112 V74 L100 58 L122 74 V112"/></g>
<g fill="currentColor"><circle cx="78" cy="74" r="7"/><circle cx="100" cy="58" r="7"/><circle cx="122" cy="74" r="7"/></g>
</svg></div>
    <div class="display" style="font-size:52pt">Coffee<br>Session</div>
    <div class="rule rule--full" style="margin:6mm 0 5mm"></div>
    <div class="sans" style="font-family:'Space Grotesk',sans-serif;font-size:15pt;color:var(--bone)">
      Pour. Sip. Chat.
    </div>
    <p class="mono" style="font-size:7pt;line-height:1.7;color:var(--sage);margin-top:4mm;max-width:105mm;text-transform:uppercase">
      Three special lots — Disco&nbsp;Candy, Rose&nbsp;Fizz, Crazy&nbsp;Pop. Exotic varieties,
      enzymatic fermentation, roasted in Brno by Fifty&nbsp;Beans.
    </p>
    <div class="row" style="margin-top:10mm;align-items:flex-end">
      <div class="display" style="font-size:13pt;color:var(--sage)">Build&nbsp;the<br>Parallel.</div>
      <img src="../assets/img/qr-logos.png" alt="" style="width:22mm;height:22mm;image-rendering:pixelated">
    </div>
  </div>
</div>
</body></html>
